[project]
name = "haqqi-core"
version = "0.1.0"
description = "Open-source RAG pipeline for Moroccan legal PDFs (FastAPI + Qdrant + FastEmbed + ColBERT reranking)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "qdrant-client[fastembed]>=1.17.0",
  "docling>=2.0.0",
  "sentence-transformers>=2.2",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project.scripts]
haqqi = "src.cli:main"
haqqi-api = "src.main:run"
haqqi-export = "src.hf_export:main"
haqqi-core-api = "src.main:run"
haqqi-core-ingest = "src.cli:main"
haqqi-core-hf-export = "src.hf_export:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
